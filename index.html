<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYFTKOGTECH — AI Business Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070d1a; --card:#0d1829; --border:#1a2a3a; --cyan:#00aadd; --cyan-dark:#0066aa;
    --text:#e2e8f0; --muted:#4a6a8a; --green:#00d4aa; --amber:#f59e0b; --red:#ef4444; --purple:#8b8bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
  input,textarea,button{font-family:inherit}
  ::placeholder{color:#33506b}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px}
  .btn{padding:12px 20px;background:linear-gradient(135deg,var(--cyan-dark),var(--cyan));border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .ghost{padding:10px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
  .input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none}
  .label{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block}
  .tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:36px;height:36px;background:linear-gradient(135deg,var(--cyan-dark),var(--cyan));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
  .spin{width:56px;height:56px;border:3px solid var(--border);border-top:3px solid var(--cyan);border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tabbtn{flex:1;padding:9px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
  .tabbtn.active{background:#0a2040;border-color:#1a4060;color:var(--cyan);font-weight:600}
  @media(max-width:640px){.hide-sm{display:none}}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const DEMO_CLIENTS = {
  "admin@syftkogtech.com": { password: "syftkog2026", name: "Davie Hodge", role: "admin", company: "SYFTKOGTECH" },
  "client@riversidecoffee.com": { password: "coffee123", name: "Sarah Chen", role: "client", company: "Riverside Coffee Co." },
  "demo@acmecorp.com": { password: "demo123", name: "James Miller", role: "client", company: "Acme Corp" },
};

const SAMPLE_DATA = `Q2 2026 Business Report - Riverside Coffee Co.
Revenue: $142,000 (down 8% from Q1's $154,000)
New customers: 89 (down from 120 in Q1)
Returning customers: 340 (up from 290 in Q1)
Average order value: $28.50 (up from $24.00)
Top product: Seasonal Latte - 1,240 units sold
Lowest product: Cold Brew - 89 units sold
Staff costs: $58,000 (up 12%)
Rent: $18,000 (unchanged)
Marketing spend: $2,400 (down 40% from Q1)
Customer complaints: 14 (up from 6 in Q1)
Online orders: 23% of total (up from 15%)
Peak hours: 7-9am and 12-1pm
Slow hours: 2-5pm (avg 3 customers/hour)`;

const scoreColor = s => s >= 75 ? "var(--green)" : s >= 50 ? "var(--amber)" : "var(--red)";
const impactBadge = i => ({ high:{bg:"#1a3a2a",color:"#00d4aa",label:"High Impact"}, medium:{bg:"#2a2a1a",color:"#f59e0b",label:"Medium Impact"}, low:{bg:"#1a1a2a",color:"#8b8bff",label:"Low Impact"} }[i] || {bg:"#1a1a2a",color:"#8b8bff",label:i});
const priorityBadge = p => ({ immediate:{bg:"#3a1a1a",color:"#ef4444",label:"Immediate"}, "short-term":{bg:"#2a2a1a",color:"#f59e0b",label:"Short-term"}, "long-term":{bg:"#1a1a2a",color:"#8b8bff",label:"Long-term"} }[p] || {bg:"#1a1a2a",color:"#8b8bff",label:p});
const insightColor = t => t === "positive" ? "#00d4aa" : t === "warning" ? "#f59e0b" : "#8b8bff";
const insightIcon = t => t === "positive" ? "▲" : t === "warning" ? "⚠" : "●";
const formatDate = d => new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"2-digit",minute:"2-digit"});

function App(){
  const [screen,setScreen] = useState("login");
  const [user,setUser] = useState(null);
  const [loginEmail,setLoginEmail] = useState("");
  const [loginPass,setLoginPass] = useState("");
  const [loginError,setLoginError] = useState("");
  const [inputData,setInputData] = useState("");
  const [analysis,setAnalysis] = useState(null);
  const [loading,setLoading] = useState(false);
  const [error,setError] = useState("");
  const [activeTab,setActiveTab] = useState("insights");
  const [reports,setReports] = useState([]);
  const [reportTitle,setReportTitle] = useState("");
  const [viewingReport,setViewingReport] = useState(null);
  const [saved,setSaved] = useState(false);

  useEffect(()=>{
    if(user){
      try{ setReports(JSON.parse(localStorage.getItem("reports_"+user.email)||"[]")); }
      catch{ setReports([]); }
    }
  },[user]);

  const saveReports = updated => {
    localStorage.setItem("reports_"+user.email, JSON.stringify(updated));
    setReports(updated);
  };

  const handleLogin = () => {
    const c = DEMO_CLIENTS[loginEmail.toLowerCase().trim()];
    if(!c || c.password !== loginPass){ setLoginError("Invalid email or password."); return; }
    setUser({ ...c, email: loginEmail.toLowerCase().trim() });
    setLoginError(""); setScreen("dashboard");
  };

  const handleLogout = () => {
    setUser(null); setScreen("login"); setAnalysis(null);
    setInputData(""); setLoginEmail(""); setLoginPass("");
  };

  const analyzeData = async () => {
    if(!inputData.trim()){ setError("Please enter business data before analyzing."); return; }
    setError(""); setLoading(true); setAnalysis(null); setSaved(false);
    try{
      const res = await fetch("/.netlify/functions/analyze",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ data: inputData })
      });
      const data = await res.json();
      if(!res.ok){ throw new Error(data.error || "Analysis failed"); }
      setAnalysis(data);
      setActiveTab("insights");
      setScreen("report");
    }catch(err){
      setError(err.message || "Analysis failed. Please try again.");
    }finally{ setLoading(false); }
  };

  const saveReport = () => {
    const title = reportTitle.trim() || ("Report — " + new Date().toLocaleDateString());
    const newReport = { id: Date.now(), title, date: Date.now(), analysis, inputData, healthScore: analysis.healthScore };
    saveReports([newReport, ...reports]);
    setSaved(true); setReportTitle("");
  };

  const deleteReport = id => saveReports(reports.filter(r=>r.id!==id));

  const Header = () => (
    <div className="header">
      <div className="logo">S</div>
      <div>
        <div style={{fontSize:14,fontWeight:700,color:"#fff",letterSpacing:1}}>SYFTKOGTECH</div>
        <div style={{fontSize:10,color:"var(--muted)",letterSpacing:2}}>AI BUSINESS INTELLIGENCE</div>
      </div>
      {user && (
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span className="hide-sm" style={{fontSize:12,color:"var(--muted)"}}>
            {user.name} · <span style={{color:"var(--cyan)"}}>{user.company}</span>
          </span>
          <button className="ghost" style={{fontSize:12,padding:"7px 12px"}} onClick={()=>{setScreen("dashboard");setAnalysis(null);setInputData("");setViewingReport(null);}}>Dashboard</button>
          <button className="ghost" style={{fontSize:12,padding:"7px 12px"}} onClick={()=>setScreen("history")}>Reports</button>
          <button className="ghost" style={{fontSize:12,padding:"7px 12px",color:"var(--red)",borderColor:"#3a1a1a"}} onClick={handleLogout}>Sign Out</button>
        </div>
      )}
    </div>
  );

  if(screen==="login") return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="logo" style={{width:60,height:60,borderRadius:16,fontSize:26,marginBottom:16}}>S</div>
      <div style={{fontSize:22,fontWeight:700,color:"#fff",marginBottom:4}}>SYFTKOGTECH</div>
      <div style={{fontSize:12,color:"var(--muted)",letterSpacing:3,marginBottom:36}}>CLIENT PORTAL</div>
      <div className="card" style={{width:"100%",maxWidth:400,padding:32}}>
        <div style={{fontSize:16,fontWeight:600,color:"#fff",marginBottom:24}}>Sign in to your account</div>
        <div style={{marginBottom:16}}>
          <label className="label">Email Address</label>
          <input className="input" value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} placeholder="your@email.com" onKeyDown={e=>e.key==="Enter"&&handleLogin()} />
        </div>
        <div style={{marginBottom:20}}>
          <label className="label">Password</label>
          <input className="input" type="password" value={loginPass} onChange={e=>setLoginPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&handleLogin()} />
        </div>
        {loginError && <div style={{padding:"10px 14px",background:"#2a0d0d",border:"1px solid #5a1a1a",borderRadius:8,color:"var(--red)",fontSize:13,marginBottom:16}}>{loginError}</div>}
        <button className="btn" style={{width:"100%"}} onClick={handleLogin}>Sign In →</button>
      </div>
      <div style={{marginTop:24,fontSize:11,color:"#2a3a4a",letterSpacing:1}}>POWERED BY SYFTKOGTECH</div>
    </div>
  );

  if(loading) return (
    <div>
      <Header/>
      <div style={{textAlign:"center",padding:"80px 20px"}}>
        <div className="spin"></div>
        <div style={{color:"var(--cyan)",fontSize:14,letterSpacing:2}}>PROCESSING INTELLIGENCE...</div>
        <div style={{color:"var(--muted)",fontSize:12,marginTop:8}}>Identifying patterns and opportunities in your data</div>
      </div>
    </div>
  );

  if(screen==="history") return (
    <div>
      <Header/>
      <div style={{maxWidth:860,margin:"0 auto",padding:"32px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontSize:20,fontWeight:700,color:"#fff"}}>Saved Reports</div>
            <div style={{fontSize:13,color:"var(--muted)",marginTop:2}}>{reports.length} report{reports.length!==1?"s":""} saved</div>
          </div>
          <button className="btn" onClick={()=>setScreen("dashboard")}>+ New Analysis</button>
        </div>
        {reports.length===0 ? (
          <div className="card" style={{padding:60,textAlign:"center"}}>
            <div style={{fontSize:40,marginBottom:16}}>📊</div>
            <div style={{fontSize:16,color:"#fff",marginBottom:8}}>No reports yet</div>
            <div style={{fontSize:13,color:"var(--muted)"}}>Run your first analysis and save it to see it here</div>
          </div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {reports.map(r=>(
              <div key={r.id} className="card" style={{padding:"18px 20px",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
                <div style={{width:52,height:52,background:"#0a2040",border:"1px solid var(--border)",borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <div style={{fontSize:18,fontWeight:800,color:scoreColor(r.healthScore),lineHeight:1}}>{r.healthScore}</div>
                  <div style={{fontSize:9,color:"var(--muted)"}}>SCORE</div>
                </div>
                <div style={{flex:1,minWidth:150}}>
                  <div style={{fontSize:14,fontWeight:600,color:"#fff",marginBottom:3}}>{r.title}</div>
                  <div style={{fontSize:12,color:"var(--muted)"}}>{formatDate(r.date)}</div>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button className="ghost" style={{fontSize:12,padding:"8px 14px",color:"var(--cyan)",borderColor:"#1a3a4a"}} onClick={()=>{setViewingReport(r);setAnalysis(r.analysis);setActiveTab("insights");setScreen("report");}}>View</button>
                  <button className="ghost" style={{fontSize:12,padding:"8px 14px",color:"var(--red)",borderColor:"#3a1a1a"}} onClick={()=>deleteReport(r.id)}>Delete</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  if(screen==="report" && analysis) return (
    <div>
      <Header/>
      <div style={{maxWidth:860,margin:"0 auto",padding:"28px 20px"}}>
        {!viewingReport && (
          <div className="card" style={{padding:"14px 18px",marginBottom:20,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <input className="input" style={{flex:1,minWidth:180,padding:"9px 12px",fontSize:13}} value={reportTitle} onChange={e=>setReportTitle(e.target.value)} placeholder="Name this report (optional)..." />
            <button className="btn" style={{padding:"9px 18px",fontSize:13}} disabled={saved} onClick={saveReport}>{saved?"✓ Saved":"Save Report"}</button>
          </div>
        )}
        {viewingReport && (
          <div style={{marginBottom:16,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <button className="ghost" onClick={()=>{setScreen("history");setViewingReport(null);setAnalysis(null);}}>← Back to Reports</button>
            <div style={{fontSize:15,fontWeight:600,color:"#fff"}}>{viewingReport.title}</div>
            <div style={{fontSize:12,color:"var(--muted)"}}>{formatDate(viewingReport.date)}</div>
          </div>
        )}

        <div style={{display:"grid",gridTemplateColumns:"1fr 130px",gap:14,marginBottom:16}}>
          <div className="card" style={{padding:"18px 22px"}}>
            <div style={{fontSize:10,color:"var(--muted)",letterSpacing:2,marginBottom:8}}>EXECUTIVE SUMMARY</div>
            <div style={{fontSize:14,lineHeight:1.6}}>{analysis.summary}</div>
          </div>
          <div className="card" style={{padding:18,textAlign:"center"}}>
            <div style={{fontSize:10,color:"var(--muted)",letterSpacing:2,marginBottom:8}}>HEALTH SCORE</div>
            <div style={{fontSize:44,fontWeight:800,color:scoreColor(analysis.healthScore),lineHeight:1}}>{analysis.healthScore}</div>
            <div style={{fontSize:10,color:"var(--muted)",marginTop:4}}>out of 100</div>
            <div style={{marginTop:10,height:5,background:"var(--border)",borderRadius:3,overflow:"hidden"}}>
              <div style={{height:"100%",width:analysis.healthScore+"%",background:scoreColor(analysis.healthScore),borderRadius:3}}></div>
            </div>
          </div>
        </div>

        <div style={{display:"flex",gap:4,marginBottom:14,background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:4}}>
          {[["insights","Insights"],["opportunities","Opportunities"],["recommendations","Action Plan"]].map(([key,label])=>(
            <button key={key} className={"tabbtn"+(activeTab===key?" active":"")} onClick={()=>setActiveTab(key)}>{label}</button>
          ))}
        </div>

        {activeTab==="insights" && (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {analysis.insights.map((ins,i)=>(
              <div key={i} className="card" style={{borderLeft:"3px solid "+insightColor(ins.type),padding:"16px 20px"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                  <span style={{color:insightColor(ins.type)}}>{insightIcon(ins.type)}</span>
                  <div style={{fontSize:14,fontWeight:600,color:"#fff"}}>{ins.title}</div>
                </div>
                <div style={{fontSize:13,color:"#8a9ab0",lineHeight:1.6}}>{ins.detail}</div>
              </div>
            ))}
          </div>
        )}

        {activeTab==="opportunities" && (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {analysis.opportunities.map((opp,i)=>{
              const b = impactBadge(opp.impact);
              return (
                <div key={i} className="card" style={{padding:"16px 20px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,gap:10,flexWrap:"wrap"}}>
                    <div style={{fontSize:14,fontWeight:600,color:"#fff"}}>{opp.title}</div>
                    <span className="tag" style={{background:b.bg,color:b.color}}>{b.label}</span>
                  </div>
                  <div style={{fontSize:13,color:"#8a9ab0",lineHeight:1.6}}>{opp.detail}</div>
                </div>
              );
            })}
          </div>
        )}

        {activeTab==="recommendations" && (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {analysis.recommendations.map((rec,i)=>{
              const b = priorityBadge(rec.priority);
              return (
                <div key={i} className="card" style={{padding:"16px 20px"}}>
                  <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12,marginBottom:6,flexWrap:"wrap"}}>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{width:26,height:26,background:"#0a2040",border:"1px solid #1a4060",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"var(--cyan)",flexShrink:0}}>{i+1}</div>
                      <div style={{fontSize:14,fontWeight:600,color:"#fff"}}>{rec.action}</div>
                    </div>
                    <span className="tag" style={{background:b.bg,color:b.color}}>{b.label}</span>
                  </div>
                  <div style={{fontSize:13,color:"#8a9ab0",lineHeight:1.6,marginLeft:36}}>{rec.reason}</div>
                </div>
              );
            })}
          </div>
        )}

        {!viewingReport && (
          <button className="ghost" style={{marginTop:20,width:"100%"}} onClick={()=>{setScreen("dashboard");setAnalysis(null);setInputData("");setSaved(false);}}>← New Analysis</button>
        )}
      </div>
    </div>
  );

  return (
    <div>
      <Header/>
      <div style={{maxWidth:860,margin:"0 auto",padding:"32px 20px"}}>
        <div style={{marginBottom:28}}>
          <div style={{fontSize:22,fontWeight:700,color:"#fff"}}>Welcome back, {user && user.name.split(" ")[0]}</div>
          <div style={{fontSize:13,color:"var(--muted)",marginTop:3}}>Paste your business data below to generate an AI-powered intelligence report</div>
        </div>

        {reports.length>0 && (
          <div style={{marginBottom:24}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:12,color:"var(--muted)",letterSpacing:1}}>RECENT REPORTS</div>
              <button style={{fontSize:12,color:"var(--cyan)",background:"none",border:"none",cursor:"pointer"}} onClick={()=>setScreen("history")}>View all →</button>
            </div>
            <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:4}}>
              {reports.slice(0,3).map(r=>(
                <div key={r.id} className="card" style={{padding:"14px 16px",minWidth:180,cursor:"pointer",flexShrink:0}} onClick={()=>{setViewingReport(r);setAnalysis(r.analysis);setActiveTab("insights");setScreen("report");}}>
                  <div style={{fontSize:22,fontWeight:800,color:scoreColor(r.healthScore),marginBottom:4}}>{r.healthScore}</div>
                  <div style={{fontSize:12,fontWeight:600,color:"#fff",marginBottom:2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.title}</div>
                  <div style={{fontSize:11,color:"var(--muted)"}}>{formatDate(r.date)}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="card" style={{overflow:"hidden"}}>
          <div style={{padding:"18px 22px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <div>
              <div style={{fontSize:15,fontWeight:600,color:"#fff"}}>Business Data Input</div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>Sales reports · Financial data · Customer metrics · Operational data</div>
            </div>
            <button className="ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>setInputData(SAMPLE_DATA)}>Load Sample</button>
          </div>
          <div style={{padding:"20px 22px"}}>
            <textarea value={inputData} onChange={e=>setInputData(e.target.value)}
              placeholder={"Paste your business data here...\n\nExamples:\n• Monthly sales figures\n• Revenue and expense breakdowns\n• Customer acquisition numbers\n• Operational metrics"}
              style={{width:"100%",minHeight:200,background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:14,resize:"vertical",outline:"none",fontFamily:"'Courier New',monospace",lineHeight:1.6}} />
            {error && <div style={{marginTop:10,padding:"10px 14px",background:"#2a0d0d",border:"1px solid #5a1a1a",borderRadius:8,color:"var(--red)",fontSize:13}}>{error}</div>}
            <button className="btn" style={{marginTop:14,width:"100%",padding:13,letterSpacing:1}} onClick={analyzeData} disabled={loading}>
              ⚡  RUN AI ANALYSIS
            </button>
          </div>
        </div>

        <div style={{marginTop:32,textAlign:"center",fontSize:11,color:"#1a2a3a",letterSpacing:1}}>
          POWERED BY SYFTKOGTECH · COGNITIVE AI · DATA INTELLIGENCE
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
